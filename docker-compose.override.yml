services:
  api:
    environment:
      NODE_ENV: development
    command: pnpm --filter @zeroday/api dev
    volumes:
      - .:/app
      - zeroday_node_modules:/app/node_modules
      - zeroday_api_node_modules:/app/apps/api/node_modules

volumes:
  zeroday_node_modules:
  zeroday_api_node_modules:
